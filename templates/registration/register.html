{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2 class="page-heading">Create account</h2>
  <form method="post">{% csrf_token %}
    {% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
    <button class="btn">Register</button>
  </form>
</div>
{% endblock %}
