{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2 class="page-heading">Login</h2>
  <form method="post">{% csrf_token %}
    {% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
    {{ form.non_field_errors }}
    <button class="btn">Login</button>
    <p class="muted">No account? <a href="{% url 'register' %}">Register</a></p>
  </form>
</div>
{% endblock %}
