{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2 class="page-heading">Delete?</h2>
  <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
  <form method="post">{% csrf_token %}
    <button class="btn danger">Yes, delete</button>
    <a class="btn light" href="javascript:history.back()">Cancel</a>
  </form>
</div>
{% endblock %}
