{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2 class="page-heading">{{ title }}</h2>
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
    <button class="btn">Save</button>
    <a class="btn light" href="javascript:history.back()">Cancel</a>
  </form>
</div>
{% endblock %}
